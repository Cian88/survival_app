<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Holdout — vérification de l’interface</title><style>body{margin:0}iframe{border:0;display:block}</style></head><body><pre id="result">Vérifications en cours…</pre><iframe id="app" src="../index.html" title="Application testée"></iframe><script>const frame=document.querySelector("#app");frame.style.width=(new URLSearchParams(location.search).get("width")||"1280")+"px";frame.style.height="900px";frame.onload=async()=>{const checks=[], errors=[]; const w=frame.contentWindow,d=w.document; w.addEventListener('error',e=>errors.push(e.message)); const pause=()=>new Promise(r=>setTimeout(r,250)); const check=(name,pass)=>{checks.push({name,pass:!!pass});};let stateBefore="{}";try{
/* Compte obligatoire : jamais le vrai serveur ici. Serveur injoignable → compte d'essai créé sur l'appareil (parcours hors ligne). */
if(w.localStorage.getItem('holdout.dev.api')!=='http://127.0.0.1:9'){w.localStorage.setItem('holdout.dev.api','http://127.0.0.1:9');w.location.reload();return;}
const until=async(f,ms=20000)=>{const t=Date.now();while(Date.now()-t<ms){if(f())return true;await new Promise(r=>setTimeout(r,100));}return false;};
await until(()=>w.Account&&(d.querySelector('#authGate')||w.Account.user));
if(d.querySelector('#authGate')){check('Account required before use',d.querySelector('#main').inert===true);
const f=d.querySelector('#authGate form[data-form="create"]');if(f){f.elements.email.value='smoke@example.org';f.elements.password.value='mot de passe smoke';f.elements.password2.value='mot de passe smoke';f.requestSubmit();}
await until(()=>d.querySelector('#authGate form[data-form="recovery-ok"]'));const r=d.querySelector('#authGate form[data-form="recovery-ok"]');if(r){r.elements.ok.checked=true;r.requestSubmit();}
check('Offline account creation opens the app',await until(()=>!d.querySelector('#authGate')&&w.Account.user&&w.Account.user.pending==='register'));}
w.App.go('profile');check('Account card in profile',!!d.querySelector('#accountCard'));
check('Application initialized',!!w.App);w.App.go('bag'); w.App.go('now'); stateBefore=JSON.stringify(w.App.state);
for(const tab of ['now','audit','profile','bag','home','field','calc','gear','plan','notice','premium']){w.App.go(tab);check('Render '+tab,d.querySelector('#tab-'+tab).classList.contains('on')&&d.querySelector('#tab-'+tab).children.length>0);check('Only one active screen: '+tab,d.querySelectorAll('.tab.on').length===1);}
w.App.go('now');check('Four live resource cards',d.querySelectorAll('.now-metrics .metric').length===4);d.querySelector('[data-sit="courant"]').click();check('Crisis checklist opens',!!d.querySelector('.sitpanel .steps'));d.querySelector('[data-sit="courant"]').click();check('Crisis checklist closes',!d.querySelector('.sitpanel'));
w.App.go('map');const rect=d.querySelector('#map').getBoundingClientRect();check('Map covers viewport',Math.abs(rect.width-w.innerWidth)<2&&Math.abs(rect.height-w.innerHeight)<2&&rect.top===0&&rect.left===0);check('Navigation hidden on map',w.getComputedStyle(d.querySelector('.top')).display==='none');check('Map options initially closed',d.querySelector('#mapDrawer').hidden);d.querySelector('#mapPanelToggle').click();check('Options open and ARIA reflects state',!d.querySelector('#mapDrawer').hidden&&d.querySelector('#mapPanelToggle').getAttribute('aria-expanded')==='true');check('Map download tools preserved',!!d.querySelector('#btnPack')&&!!d.querySelector('#btnOsm')&&!!d.querySelector('#btnClearOtm'));check('Single topographic base (MapLibre), no base selector',d.querySelectorAll('.leaflet-control-layers-base input').length===0&&!!d.querySelector('.leaflet-tile-pane .leaflet-gl-layer')&&!d.querySelector('#pmFile')&&!d.querySelector('#pkZ'));const drawer=d.querySelector('#mapDrawer').getBoundingClientRect();check('Options remain within viewport',drawer.left>=0&&drawer.right<=w.innerWidth&&drawer.top>=0&&drawer.bottom<=w.innerHeight);d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check('Escape closes options',d.querySelector('#mapDrawer').hidden);d.querySelector('#mapBack').click();check('Return restores previous screen',d.querySelector('#tab-now').classList.contains('on')&&!d.body.classList.contains('map-mode'));w.App.go('profile');w.SurvivalMap.focus(46.6,2.5,6,'Test point');check('Map opens from coordinates',d.body.classList.contains('map-mode'));d.querySelector('#mapBack').click();check('Return restores originating profile',d.querySelector('#tab-profile').classList.contains('on'));
d.querySelector('#bottombar [data-more]').click();check('More menu opens',!!d.querySelector('.sheet'));d.querySelector('.sheet [data-tab="bag"]').click();check('More menu navigates and closes',!d.querySelector('.sheet')&&d.querySelector('#tab-bag').classList.contains('on'));
for(const theme of ['light','dark']){d.documentElement.dataset.theme=theme;check('Theme '+theme+' applied',w.getComputedStyle(d.documentElement).getPropertyValue('--bg').trim()===(theme==='light'?'#f5f6f2':'#15201b'));}
w.App.go('now');check('No horizontal overflow',d.documentElement.scrollWidth<=w.innerWidth+1);check('Navigation preserves user data',JSON.stringify(w.App.state)===stateBefore);check('No JavaScript errors',errors.length===0);
}catch(e){checks.push({name:'Unexpected exception: '+e.stack,pass:false});}const result={width:w.innerWidth,checks,errors,stateBefore:JSON.parse(stateBefore),stateAfter:w.App.state};document.querySelector('#result').style='position:fixed;inset:0;z-index:6000;background:white;color:black;overflow:auto;white-space:pre-wrap;font:10px monospace;margin:0;padding:8px';document.querySelector('#result').textContent=JSON.stringify(result,null,2);};</script></body></html>
