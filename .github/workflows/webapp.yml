# Publie la webapp (PWA installable, utilisable hors ligne) sur GitHub Pages à chaque push sur main.
# Prérequis : Settings › Pages › Source : « GitHub Actions ». Pour un dépôt privé, GitHub Pages
# demande un compte GitHub Pro, Team ou Enterprise ; le site publié est public.
name: Webapp (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler la webapp
        run: node tools/build-www.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
